<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區管理委員會 - 會議紀錄決議總覽</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f1f5f9; color: #1e293b; line-height: 1.6; padding-bottom: 3rem; }
        
        header { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 2rem 1rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700; }
        header .badge { background-color: rgba(255, 255, 255, 0.2); padding: 0.3rem 0.8rem; border-radius: 9999px; font-size: 0.85rem; display: inline-block; border: 1px solid rgba(255, 255, 255, 0.4); }

        .container { max-width: 850px; margin: -1.5rem auto 0; padding: 0 1rem; position: relative; z-index: 10; }

        .search-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; margin-bottom: 2rem; }
        .search-title { font-size: 1.1rem; font-weight: bold; color: #1e293b; margin-bottom: 0.6rem; }
        .search-box { display: flex; gap: 0.5rem; }
        .search-input { flex: 1; padding: 0.8rem 1rem; font-size: 1.05rem; border: 2px solid #2563eb; border-radius: 8px; outline: none; }
        .clear-btn { padding: 0.8rem 1.2rem; background-color: #64748b; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .search-tip { font-size: 0.85rem; color: #64748b; margin-top: 0.6rem; }

        .meeting-card { background: white; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 1.5rem; overflow: hidden; }
        .meeting-header { background-color: #f8fafc; padding: 1rem 1.25rem; border-bottom: 2px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .meeting-info { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .meeting-title { font-size: 1.2rem; font-weight: bold; color: #0f172a; }
        .meeting-date { font-size: 0.85rem; background-color: #e2e8f0; color: #334155; padding: 0.25rem 0.6rem; border-radius: 6px; font-weight: 600; }
        .view-pdf-btn { background-color: #2563eb; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        .view-pdf-btn:hover { background-color: #1d4ed8; }

        .meeting-body { padding: 1.25rem; }

        ul { list-style: none; }
        li { margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 1px dashed #e2e8f0; }
        li:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        
        .tag { display: inline-block; background-color: #dbeafe; color: #1e40af; font-size: 0.8rem; font-weight: bold; padding: 0.25rem 0.6rem; border-radius: 4px; margin-right: 0.5rem; margin-bottom: 0.3rem; }
        .content-text { font-size: 0.98rem; color: #334155; white-space: pre-line; }

        .loading, .no-result { text-align: center; padding: 3rem 1rem; background: white; border-radius: 12px; color: #64748b; }
        footer { text-align: center; margin-top: 2rem; color: #94a3b8; font-size: 0.85rem; }

        /* ================= 抽屜式側滑選單 CSS ================= */
        .drawer-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            z-index: 999;
        }

        .drawer {
            position: fixed;
            top: 0; right: -600px;
            width: 550px;
            max-width: 90vw;
            height: 100%;
            background: #ffffff;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
            transition: right 0.3s ease-in-out;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .drawer.open { right: 0; }
        .drawer-overlay.open { display: block; }

        .drawer-header {
            padding: 1.25rem;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-title { font-size: 1.25rem; font-weight: 700; color: #0f172a; }

        .close-btn {
            background: none; border: none;
            font-size: 1.8rem; color: #64748b;
            cursor: pointer; line-height: 1;
        }

        .drawer-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .drawer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #64748b;
        }

        .external-link-btn {
            display: inline-block;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .pdf-frame-container {
            width: 100%;
            height: 600px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background-color: #f1f5f9;
        }

        .pdf-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .no-pdf-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: #64748b;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <h1>社區管理委員會 - 會議決議總覽</h1>
        <span class="badge">即時連線更新中</span>
    </header>

    <div class="container">

        <div class="search-card">
            <div class="search-title">🔍 關鍵字搜尋會議決議</div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="請輸入關鍵字（例如：水塔、防焰、端午、點數...）" onkeyup="filterContent()">
                <button class="clear-btn" onclick="clearSearch()">清除搜尋</button>
            </div>
            <div class="search-tip">💡 輸入關鍵字後，系統會自動搜尋並即時顯示相關的會議紀錄。</div>
        </div>

        <div id="loading" class="loading">⏳ 正在載入最新會議紀錄，請稍候...</div>
        <div id="noResult" class="no-result" style="display: none;">
            <h3>😔 查無相關決議紀錄</h3>
            <p style="margin-top: 0.5rem;">請嘗試換其他關鍵字搜尋。</p>
        </div>

        <div id="meetingList"></div>

        <footer>
            <p>社區管理委員會 製作發布</p>
        </footer>

    </div>

    <!-- 右側滑出抽屜 (Drawer) -->
    <div id="drawerOverlay" class="drawer-overlay" onclick="closeDrawer()"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <h3 id="drawerTitle" class="drawer-title">會議紀錄詳情</h3>
            <button class="close-btn" onclick="closeDrawer()">&times;</button>
        </div>
        <div class="drawer-body">
            <div class="drawer-meta">
                <span id="drawerDate"></span>
                <a id="drawerExternalLink" href="#" target="_blank" class="external-link-btn" style="display: none;">↗ 在新分頁開啟 PDF</a>
            </div>
            <div id="pdfContainer" class="pdf-frame-container">
                <iframe id="pdfFrame" src=""></iframe>
            </div>
            <div id="noPdfMsg" class="no-pdf-msg" style="display: none;">
                📄 本場會議暫未上傳完整 PDF 檔案。
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1TziBWbOghOO7UHj_Pg5R4OfWM442_qYnOdoCALRY5Tg';
        
        // 抓取 1~59 次歷史紀錄（工作表名稱：歷史紀錄）
        const HISTORICAL_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=歷史紀錄`;
        
        // 抓取 60 次以後的表單回覆（工作表名稱：表單回覆 1）
        const FORM_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=表單回覆 1`;

        let rawMeetingsData = {};

        // 解析 Google 試算表 JSON 資料
        function parseJsonData(text) {
            const json = JSON.parse(text.substring(47, text.length - 2));
            return json.table.rows || [];
        }

        // 同時獲取兩個工作表的資料並合併
        Promise.all([
            fetch(HISTORICAL_URL).then(res => res.text()).catch(() => null),
            fetch(FORM_URL).then(res => res.text()).catch(() => null)
        ]).then(([historyText, formText]) => {
            const meetings = {};

            // 1. 處理 1~59 次歷史資料
            if (historyText) {
                const rows = parseJsonData(historyText);
                rows.forEach(row => {
                    if (!row.c || !row.c[0]) return;
                    const title = row.c[0] ? row.c[0].v : '';
                    const date = row.c[1] ? row.c[1].v : '';
                    const tag = row.c[2] ? row.c[2].v : '決議';
                    const content = row.c[3] ? row.c[3].v : '';
                    const pdfUrl = (row.c[4] && row.c[4].v) ? row.c[4].v : '';

                    if (!meetings[title]) {
                        meetings[title] = { date: date, pdfUrl: pdfUrl, items: [] };
                    }
                    meetings[title].items.push({ tag: tag, content: content });
                });
            }

            // 2. 處理 60 次以後的表單回覆資料
            // 表單欄位：[0]時間戳記, [1]會議名稱, [2]日期, [3]摘要內容, [4]PDF連結
            if (formText) {
                const rows = parseJsonData(formText);
                rows.forEach(row => {
                    if (!row.c || !row.c[1]) return;
                    const title = row.c[1] ? row.c[1].v : '';
                    const date = row.c[2] ? row.c[2].v : '';
                    const content = row.c[3] ? row.c[3].v : '';
                    const pdfUrl = (row.c[4] && row.c[4].v) ? row.c[4].v : '';

                    if (!meetings[title]) {
                        meetings[title] = { date: date, pdfUrl: pdfUrl, items: [] };
                    }
                    meetings[title].items.push({ tag: '決議摘要', content: content });
                });
            }

            rawMeetingsData = meetings;
            renderMeetings(meetings);
            document.getElementById('loading').style.display = 'none';
        }).catch(err => {
            console.error(err);
            document.getElementById('loading').innerHTML = '❌ 資料載入失敗，請確認工作表名稱與公開設定。';
        });

        // 渲染會議紀錄卡片
        function renderMeetings(meetings) {
            const container = document.getElementById('meetingList');
            container.innerHTML = '';

            for (const [title, data] of Object.entries(meetings)) {
                const card = document.createElement('div');
                card.className = 'meeting-card';

                let listHtml = '';
                data.items.forEach(item => {
                    listHtml += `<li><span class="tag">${item.tag}</span><span class="content-text">${item.content}</span></li>`;
                });

                const safeTitle = title.replace(/'/g, "\\'");

                card.innerHTML = `
                    <div class="meeting-header">
                        <div class="meeting-info">
                            <span class="meeting-title">${title}</span>
                            <span class="meeting-date">${data.date}</span>
                        </div>
                        <button class="view-pdf-btn" onclick="openDrawer('${safeTitle}')">📄 檢閱完整紀錄 (PDF)</button>
                    </div>
                    <div class="meeting-body">
                        <ul>${listHtml}</ul>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // 開啟右側抽屜 (Drawer)
        function openDrawer(title) {
            const data = rawMeetingsData[title];
            if (!data) return;

            document.getElementById('drawerTitle').innerText = title;
            document.getElementById('drawerDate').innerText = '📅 會議日期：' + (data.date || '未提供');

            const pdfContainer = document.getElementById('pdfContainer');
            const noPdfMsg = document.getElementById('noPdfMsg');
            const pdfFrame = document.getElementById('pdfFrame');
            const externalLink = document.getElementById('drawerExternalLink');

            if (data.pdfUrl && data.pdfUrl.trim() !== '') {
                let embedUrl = data.pdfUrl.trim();
                if (embedUrl.includes('drive.google.com')) {
                    embedUrl = embedUrl.replace(/\/view.*$/, '/preview');
                }

                pdfFrame.src = embedUrl;
                externalLink.href = data.pdfUrl;
                externalLink.style.display = 'inline-block';
                pdfContainer.style.display = 'block';
                noPdfMsg.style.display = 'none';
            } else {
                pdfFrame.src = '';
                externalLink.style.display = 'none';
                pdfContainer.style.display = 'none';
                noPdfMsg.style.display = 'block';
            }

            document.getElementById('drawer').classList.add('open');
            document.getElementById('drawerOverlay').classList.add('open');
        }

        // 關閉右側抽屜
        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawerOverlay').classList.remove('open');
            document.getElementById('pdfFrame').src = '';
        }

        // 搜尋功能
        function filterContent() {
            var input = document.getElementById('searchInput').value.toLowerCase().trim();
            var cards = document.getElementsByClassName('meeting-card');
            var hasVisible = false;

            for (var i = 0; i < cards.length; i++) {
                var cardText = cards[i].innerText.toLowerCase();
                if (cardText.includes(input)) {
                    cards[i].style.display = "";
                    hasVisible = true;
                } else {
                    cards[i].style.display = "none";
                }
            }

            var noResult = document.getElementById('noResult');
            noResult.style.display = hasVisible ? "none" : "block";
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterContent();
        }
    </script>
</body>
</html>
