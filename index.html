<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區會議紀錄與決議事項</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-color: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #666;
        }

        .meeting-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            padding: 20px;
            border-left: 5px solid var(--accent-color);
        }

        .meeting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }

        .meeting-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }

        .meeting-meta {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .meeting-date {
            color: #666;
            font-size: 0.95rem;
        }

        .pdf-btn {
            display: inline-flex;
            align-items: center;
            background-color: #e74c3c;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .pdf-btn:hover {
            background-color: #c0392b;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-row {
            padding: 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .item-tag {
            background-color: #e8f4f8;
            color: #2980b9;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .item-content {
            flex-grow: 1;
            word-break: break-word;
        }

        .error-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>管委會會議紀錄歷史查詢</h1>
        <p>提供歷屆會議決議事項與 PDF 紀錄檔案下載</p>
    </header>

    <div id="loading">⏳ 資料載入中，請稍候...</div>
    <div id="error-container"></div>
    <div id="meetings-container"></div>
</div>

<script>
    // ================= 1. 請在此處設定您的試算表資訊 =================
    const SPREADSHEET_ID = '貼上您的_SPREADSHEET_ID'; // 例如：1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms
    
    // 工作表1（1~59次歷史紀錄）網址
    const HISTORICAL_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent('歷史紀錄')}`;
    
    // 工作表2（60次以後表單回覆）網址 - 若工作表改名請同步更新 sheet 參數
    const FORM_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent('表單回覆 1')}`;

    // ================= 2. 工具函數 =================

    // 清除 Google Viz API 回傳字串前後的保護語法，轉為 JSON 物件
    function parseGoogleResponse(responseText) {
        if (!responseText) return null;
        try {
            const jsonString = responseText.replace(/^/*O_o*//\s*/, '').replace(/google\.visualization\.Query\.setResponse\((.*)\);?$/, '$1');
            return JSON.parse(jsonString);
        } catch (e) {
            console.error("解析 Google 回傳 JSON 失敗：", e);
            return null;
        }
    }

    // Google Drive 檔案連結優化（確保連結能在瀏覽器直接開啟檢視）
    function formatPdfUrl(url) {
        if (!url || typeof url !== 'string') return '';
        let cleanUrl = url.trim();
        
        // 如果是 Google 表單自動填寫的 drive file/d/xxxx/view 格式，換成 preview 模式更順暢
        if (cleanUrl.includes('drive.google.com') && cleanUrl.includes('/view')) {
            cleanUrl = cleanUrl.replace('/view', '/preview');
        }
        return cleanUrl;
    }

    // ================= 3. 主資料抓取邏輯 =================
    
    Promise.all([
        fetch(HISTORICAL_URL).then(res => res.text()).catch(err => { console.warn("歷史紀錄讀取失敗", err); return null; }),
        fetch(FORM_URL).then(res => res.text()).catch(err => { console.warn("表單回覆讀取失敗", err); return null; })
    ]).then(([historyText, formText]) => {
        const meetings = {};
        let totalLoadedCount = 0;

        // --- 階段 A: 解析工作表 1 (1~59 次歷史紀錄) ---
        // 欄位：A=會議名稱, B=會議日期, C=標籤, D=會議內容/摘要, E=PDF網址
        if (historyText) {
            const dataObj = parseGoogleResponse(historyText);
            if (dataObj && dataObj.table && dataObj.table.rows) {
                dataObj.table.rows.forEach(row => {
                    if (!row.c || !row.c[0] || !row.c[0].v) return;

                    const title = row.c[0].v.toString().trim();
                    const date = row.c[1] && row.c[1].v ? row.c[1].v.toString() : '';
                    const tag = row.c[2] && row.c[2].v ? row.c[2].v.toString() : '決議';
                    const content = row.c[3] && row.c[3].v ? row.c[3].v.toString() : '';
                    const pdfUrl = row.c[4] && row.c[4].v ? formatPdfUrl(row.c[4].v.toString()) : '';

                    if (!meetings[title]) {
                        meetings[title] = { date: date, pdfUrl: pdfUrl, items: [] };
                    }
                    if (content) {
                        meetings[title].items.push({ tag: tag, content: content });
                    }
                    totalLoadedCount++;
                });
            }
        }

        // --- 階段 B: 解析工作表 2 (60 次以後表單回覆 1) ---
        // 欄位：A=時間戳記, B=會議抬頭, C=會議日期, D=標題, E=會議摘要, F=會議紀錄上傳, G=AppsScript備用PDF網址
        if (formText) {
            const dataObj = parseGoogleResponse(formText);
            if (dataObj && dataObj.table && dataObj.table.rows) {
                dataObj.table.rows.forEach(row => {
                    if (!row.c || !row.c[1] || !row.c[1].v) return; // 沒有「會議抬頭」則跳過

                    const title = row.c[1].v.toString().trim();                     // B 欄：會議抬頭
                    const date = row.c[2] && row.c[2].v ? row.c[2].v.toString() : '';// C 欄：會議日期
                    const tag = row.c[3] && row.c[3].v ? row.c[3].v.toString() : '摘要';// D 欄：標題
                    const content = row.c[4] && row.c[4].v ? row.c[4].v.toString() : '';// E 欄：會議摘要

                    // PDF 網址讀取邏輯：優先採用 F 欄（表單上傳），若為空則採用 G 欄（AppsScript 補入）
                    let rawPdfUrl = '';
                    if (row.c[5] && row.c[5].v) {
                        rawPdfUrl = row.c[5].v.toString();
                    } else if (row.c[6] && row.c[6].v) {
                        rawPdfUrl = row.c[6].v.toString();
                    }
                    const pdfUrl = formatPdfUrl(rawPdfUrl);

                    if (!meetings[title]) {
                        meetings[title] = { date: date, pdfUrl: pdfUrl, items: [] };
                    } else {
                        // 如果歷史紀錄中沒有 PDF 網址，但表單產生了，予以更新補齊
                        if (!meetings[title].pdfUrl && pdfUrl) {
                            meetings[title].pdfUrl = pdfUrl;
                        }
                    }

                    if (content) {
                        meetings[title].items.push({ tag: tag, content: content });
                    }
                    totalLoadedCount++;
                });
            }
        }

        document.getElementById('loading').style.display = 'none';

        if (Object.keys(meetings).length === 0) {
            showError("未讀取到任何會議紀錄。請確認 Google 試算表權限已開啟為「知道連結的人皆可存取」，且工作表名稱設定正確。");
            return;
        }

        renderMeetings(meetings);
    }).catch(err => {
        console.error("資料載入時發生錯誤：", err);
        document.getElementById('loading').style.display = 'none';
        showError("資料載入失敗，請檢查網路連線或試算表設定。");
    });

    // ================= 4. 畫面渲染畫面 =================
    function renderMeetings(meetings) {
        const container = document.getElementById('meetings-container');
        container.innerHTML = '';

        // 將會議名稱進行降冪排序 (讓最新的會議排在最前面)
        const sortedTitles = Object.keys(meetings);

        sortedTitles.forEach(title => {
            const meeting = meetings[title];
            const card = document.createElement('div');
            card.className = 'meeting-card';

            let pdfButtonHtml = '';
            if (meeting.pdfUrl) {
                pdfButtonHtml = `<a href="${meeting.pdfUrl}" target="_blank" class="pdf-btn">📄 查看完整紀錄 PDF</a>`;
            }

            let itemsHtml = '';
            if (meeting.items && meeting.items.length > 0) {
                itemsHtml = '<ul class="item-list">' + meeting.items.map(item => `
                    <li class="item-row">
                        <span class="item-tag">${escapeHtml(item.tag)}</span>
                        <span class="item-content">${escapeHtml(item.content)}</span>
                    </li>
                `).join('') + '</ul>';
            } else {
                itemsHtml = '<p style="color: #999; font-style: italic;">（無詳細決議摘要）</p>';
            }

            card.innerHTML = `
                <div class="meeting-header">
                    <div>
                        <h2 class="meeting-title">${escapeHtml(title)}</h2>
                        <div class="meeting-date">🗓️ 開會日期：${escapeHtml(meeting.date || '未提供')}</div>
                    </div>
                    <div>${pdfButtonHtml}</div>
                </div>
                ${itemsHtml}
            `;

            container.appendChild(card);
        });
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-container');
        errorDiv.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
