<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區管理委員會 - 會議紀錄決議總覽</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f1f5f9; color: #1e293b; line-height: 1.6; padding-bottom: 3rem; }
        
        header { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; padding: 2rem 1rem; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; font-weight: 700; }
        header .badge { background-color: rgba(255, 255, 255, 0.2); padding: 0.3rem 0.8rem; border-radius: 9999px; font-size: 0.85rem; display: inline-block; border: 1px solid rgba(255, 255, 255, 0.4); }

        .container { max-width: 850px; margin: -1.5rem auto 0; padding: 0 1rem; position: relative; z-index: 10; }

        .search-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; margin-bottom: 2rem; }
        .search-title { font-size: 1.1rem; font-weight: bold; color: #1e293b; margin-bottom: 0.6rem; }
        .search-box { display: flex; gap: 0.5rem; }
        .search-input { flex: 1; padding: 0.8rem 1rem; font-size: 1.05rem; border: 2px solid #2563eb; border-radius: 8px; outline: none; }
        .clear-btn { padding: 0.8rem 1.2rem; background-color: #64748b; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .search-tip { font-size: 0.85rem; color: #64748b; margin-top: 0.6rem; }

        .meeting-card { background: white; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); margin-bottom: 1.5rem; overflow: hidden; }
        .meeting-header { background-color: #f8fafc; padding: 1rem 1.25rem; border-bottom: 2px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .meeting-title { font-size: 1.2rem; font-weight: bold; color: #0f172a; }
        .meeting-date { font-size: 0.85rem; background-color: #e2e8f0; color: #334155; padding: 0.25rem 0.6rem; border-radius: 6px; font-weight: 600; }
        .meeting-body { padding: 1.25rem; }

        ul { list-style: none; }
        li { margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 1px dashed #e2e8f0; }
        li:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        
        .tag { display: inline-block; background-color: #dbeafe; color: #1e40af; font-size: 0.8rem; font-weight: bold; padding: 0.25rem 0.6rem; border-radius: 4px; margin-right: 0.5rem; margin-bottom: 0.3rem; }
        .content-text { font-size: 0.98rem; color: #334155; }

        .loading, .no-result { text-align: center; padding: 3rem 1rem; background: white; border-radius: 12px; color: #64748b; }
        footer { text-align: center; margin-top: 2rem; color: #94a3b8; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>社區管理委員會 - 會議決議總覽</h1>
        <span class="badge">即時連線更新中</span>
    </header>

    <div class="container">

        <div class="search-card">
            <div class="search-title">🔍 關鍵字搜尋會議決議</div>
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="請輸入關鍵字（例如：水塔、防焰、端午、點數...）" onkeyup="filterContent()">
                <button class="clear-btn" onclick="clearSearch()">清除搜尋</button>
            </div>
            <div class="search-tip">💡 輸入關鍵字後，系統會自動搜尋並即時顯示相關的會議紀錄。</div>
        </div>

        <div id="loading" class="loading">⏳ 正在載入最新會議紀錄，請稍候...</div>
        <div id="noResult" class="no-result" style="display: none;">
            <h3>😔 查無相關決議紀錄</h3>
            <p style="margin-top: 0.5rem;">請嘗試換其他關鍵字搜尋。</p>
        </div>

        <div id="meetingList"></div>

        <footer>
            <p>社區管理委員會 製作發布</p>
        </footer>

    </div>

    <script>
        // 請將下方單引號內替換為您的 Google 試算表 ID
        const SHEET_ID = 'e/2PACX-1vRvA_msKtDr8mERQyM_xTVilnXOvBpX08RYW_fzULFY38vNnwGHtPLgwtGs_1V-iUJyZzGwdxxTgi-L';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/pubhtml`;

        let rawData = [];

        // 載入 Google 試算表資料
        fetch(SHEET_URL)
            .then(res => res.text())
            .then(data => {
                const json = JSON.parse(data.substring(47, data.length - 2));
                const rows = json.table.rows;
                
                // 整理資料格式
                const meetings = {};
                rows.forEach(row => {
                    if (!row.c || !row.c[0]) return;
                    const title = row.c[0] ? row.c[0].v : '';
                    const date = row.c[1] ? row.c[1].v : '';
                    const tag = row.c[2] ? row.c[2].v : '決議';
                    const content = row.c[3] ? row.c[3].v : '';

                    if (!meetings[title]) {
                        meetings[title] = { date: date, items: [] };
                    }
                    meetings[title].items.push({ tag: tag, content: content });
                });

                renderMeetings(meetings);
                document.getElementById('loading').style.display = 'none';
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = '❌ 資料載入失敗，請檢查試算表 ID 是否正確或已公開發布。';
            });

        // 渲染會議紀錄到網頁上
        function renderMeetings(meetings) {
            const container = document.getElementById('meetingList');
            container.innerHTML = '';

            for (const [title, data] of Object.entries(meetings)) {
                const card = document.createElement('div');
                card.className = 'meeting-card';

                let listHtml = '';
                data.items.forEach(item => {
                    listHtml += `<li><span class="tag">${item.tag}</span><span class="content-text">${item.content}</span></li>`;
                });

                card.innerHTML = `
                    <div class="meeting-header">
                        <span class="meeting-title">${title}</span>
                        <span class="meeting-date">${data.date}</span>
                    </div>
                    <div class="meeting-body">
                        <ul>${listHtml}</ul>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        // 搜尋功能
        function filterContent() {
            var input = document.getElementById('searchInput').value.toLowerCase().trim();
            var cards = document.getElementsByClassName('meeting-card');
            var hasVisible = false;

            for (var i = 0; i < cards.length; i++) {
                var cardText = cards[i].innerText.toLowerCase();
                if (cardText.includes(input)) {
                    cards[i].style.display = "";
                    hasVisible = true;
                } else {
                    cards[i].style.display = "none";
                }
            }

            var noResult = document.getElementById('noResult');
            if (hasVisible) {
                noResult.style.display = "none";
            } else {
                noResult.style.display = "block";
            }
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterContent();
        }
    </script>
</body>
</html>
