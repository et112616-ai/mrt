<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區會議紀錄與決議事項</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333;
            --border-color: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        /* ===== 搜尋與篩選列樣式 ===== */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }

        .search-input {
            flex-grow: 1;
            min-width: 200px;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .sort-select {
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
        }

        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #666;
        }

        .meeting-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            padding: 20px;
            border-left: 5px solid var(--accent-color);
        }

        .meeting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }

        .meeting-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 0;
        }

        .meeting-date {
            color: #666;
            font-size: 0.95rem;
        }

        .pdf-btn {
            display: inline-flex;
            align-items: center;
            background-color: #e74c3c;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .pdf-btn:hover {
            background-color: #c0392b;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-row {
            padding: 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .item-tag {
            background-color: #e8f4f8;
            color: #2980b9;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .item-content {
            flex-grow: 1;
            word-break: break-word;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 1.1rem;
        }

        .error-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>管委會會議紀錄歷史查詢</h1>
        <p>提供歷屆會議決議事項與 PDF 紀錄檔案下載</p>
    </header>

    <!-- 🔍 搜尋與篩選列 -->
    <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 輸入關鍵字搜尋（會議名稱、決議內容、標籤...）">
        <select id="sort-select" class="sort-select">
            <option value="desc" selected>排序：由新到舊</option>
            <option value="asc">排序：由舊到新</option>
        </select>
    </div>

    <div id="loading">⏳ 資料載入中，請稍候...</div>
    <div id="error-container"></div>
    <div id="meetings-container"></div>
</div>

<script>

     // ================= 1. 設定區域 =================
    
          // 1. 宣告全域變數存放會議資料
          let globalMeetings = {};

        // 2. 直接將網址寫死，避開任何變數解析錯誤的問題！
        // 歷史紀錄試算表 (請確認您的歷史紀錄是在「第一個工作表」，如果是其他名稱請把 gid=0 改掉，或確保第一個分頁就是要抓的資料)
        const HISTORICAL_URL = `https://docs.google.com/spreadsheets/d/1TziBWbOghOO7UHj_Pg5R4OfWM442_qYnOdoCALRY5Tg/gviz/tq?tqx=out:json&gid=0`;
    
        // 表單回覆試算表 (請確保這是您的表單回覆試算表 ID，同樣用 gid=0抓取第一個工作表)
        const FORM_URL = `https://docs.google.com/spreadsheets/d/1_bREXnxsJrbAo2aPz_UmcKNASL1lwiBEo5GyOFWC74E/gviz/tq?tqx=out:json&gid=0`;

    // ================= 2. 工具函數 =================
    function parseGoogleResponse(text) {
        try {
            // 1. 尋找真正的 JSON 起始點：第一個 '{'
            const startIndex = text.indexOf('{');
        
            // 2. 尋找真正的 JSON 結束點：倒數第二個 '}' (因為結尾通常是 }); )
            // 我們用 lastIndexOf 找最後一個 '}'，確保完整包住主體
            const endIndex = text.lastIndexOf('}');
        
            if (startIndex === -1 || endIndex === -1) {
                throw new Error("找不到有效的 JSON 結構");
            }

            // 3. 精準切出大括號內部的純 JSON 字串（含頭尾的大括號）
            const jsonString = text.substring(startIndex, endIndex + 1);
        
            // 4. 解析
            return JSON.parse(jsonString);
        } catch (error) {
            console.error("解析 Google JSON 失敗細節：", error, text);
            throw error;
        }
    }

    function formatPdfUrl(url) {
        if (!url || typeof url !== 'string') return '';
        let cleanUrl = url.trim();
        if (cleanUrl.includes('drive.google.com') && cleanUrl.includes('/view')) {
            cleanUrl = cleanUrl.replace('/view', '/preview');
        }
        return cleanUrl;
    }

    // ================= 3. 資料抓取與處理 =================
    Promise.all([
        fetch(HISTORICAL_URL).then(res => res.text()).catch(err => { console.warn("歷史紀錄 API 存取失敗", err); return null; }),
        fetch(FORM_URL).then(res => res.text()).catch(err => { console.warn("表單回覆 API 存取失敗", err); return null; })
    ]).then(([historyText, formText]) => {
        
        // --- 階段 A: 處理「歷史紀錄」 ---
        if (historyText) {
            const dataObj = parseGoogleResponse(historyText);
            if (dataObj && dataObj.table && dataObj.table.rows) {
                dataObj.table.rows.forEach(row => {
                    if (!row.c || !row.c[0] || !row.c[0].v) return;

                    const title = row.c[0].v.toString().trim();
                    const date = row.c[1] && row.c[1].v ? row.c[1].v.toString() : '';
                    const tag = row.c[2] && row.c[2].v ? row.c[2].v.toString() : '決議';
                    const content = row.c[3] && row.c[3].v ? row.c[3].v.toString() : '';
                    const pdfUrl = row.c[4] && row.c[4].v ? formatPdfUrl(row.c[4].v.toString()) : '';

                    if (!globalMeetings[title]) {
                        globalMeetings[title] = { date: date, pdfUrl: pdfUrl, items: [] };
                    }
                    if (content) {
                        globalMeetings[title].items.push({ tag: tag, content: content });
                    }
                });
            }
        }

        // --- 階段 B: 處理「表單回覆 1」 ---
        if (formText) {
            const dataObj = parseGoogleResponse(formText);
            if (dataObj && dataObj.table && dataObj.table.rows) {
                dataObj.table.rows.forEach(row => {
                    if (!row.c) return;

                    // 假設會議名稱在第 1 欄 (row.c[1])，若無則抓第 0 欄
                    const titleRaw = (row.c[1] && row.c[1].v) ? row.c[1].v : (row.c[0] && row.c[0].v ? row.c[0].v : null);
                    if (!titleRaw) return;

                    const title = titleRaw.toString().trim();
                    
                    // 【修正 1】檢查表單回覆的日期欄位到底是哪一欄！
                    // 假設您的表單中，開會日期在第 2 欄 (row.c[2])。如果該格有值才抓取。
                    const formDate = row.c[2] && row.c[2].v ? row.c[2].v.toString() : '';
                    
                    const tag = row.c[3] && row.c[3].v ? row.c[3].v.toString() : '摘要';
                    const content = row.c[4] && row.c[4].v ? row.c[4].v.toString() : '';

                    let rawPdfUrl = '';
                    if (row.c[5] && row.c[5].v) rawPdfUrl = row.c[5].v.toString();
                    else if (row.c[6] && row.c[6].v) rawPdfUrl = row.c[6].v.toString();
                    else if (row.c[7] && row.c[7].v) rawPdfUrl = row.c[7].v.toString();

                    const pdfUrl = formatPdfUrl(rawPdfUrl);

                    // 【修正 2】防呆保護：如果這個會議標題還不存在，才新增一個
                    if (!globalMeetings[title]) {
                        globalMeetings[title] = { date: formDate, pdfUrl: pdfUrl, items: [] };
                    } else {
                        // 如果已經存在（例如從歷史紀錄讀進來了），絕對不要被表單的空日期或錯誤日期覆蓋！
                        // 只有當原本沒有日期，且表單有提供日期時才補上
                        if (!globalMeetings[title].date && formDate) {
                            globalMeetings[title].date = formDate;
                        }
                        // 補充 PDF 連結
                        if (!globalMeetings[title].pdfUrl && pdfUrl) {
                            globalMeetings[title].pdfUrl = pdfUrl;
                        }
                    }

                    if (content) {
                        globalMeetings[title].items.push({ tag: tag, content: content });
                    }
                });
            }
        }

        document.getElementById('loading').style.display = 'none';

        if (Object.keys(globalMeetings).length === 0) {
            showError("未讀取到任何會議紀錄。請確認 Google 試算表權限已設為「知道連結的人皆可檢視」，且工作表名稱設定正確。");
            return;
        }

        // 綁定搜尋與排序監聽事件
        document.getElementById('search-input').addEventListener('input', applyFilterAndRender);
        document.getElementById('sort-select').addEventListener('change', applyFilterAndRender);

        // 初次渲染畫面
        applyFilterAndRender();

    }).catch(err => {
        console.error("載入失敗：", err);
        document.getElementById('loading').style.display = 'none';
        showError("資料載入失敗，請檢查網路連線或試算表權限。");
    });

    // ================= 4. 搜尋篩選與排序邏輯 =================
    function applyFilterAndRender() {
        const keyword = document.getElementById('search-input').value.trim().toLowerCase();
        const sortOrder = document.getElementById('sort-select').value;

        const filteredMeetings = {};

        // 進行模糊比對（搜尋：會議名稱、日期、標籤、決議內容）
        Object.keys(globalMeetings).forEach(title => {
            const meeting = globalMeetings[title];
            
            const matchTitle = title.toLowerCase().includes(keyword);
            const matchDate = meeting.date.toLowerCase().includes(keyword);
            const matchItems = meeting.items.some(item => 
                item.tag.toLowerCase().includes(keyword) || 
                item.content.toLowerCase().includes(keyword)
            );

            if (!keyword || matchTitle || matchDate || matchItems) {
                filteredMeetings[title] = meeting;
            }
        });

        // 排序處理：優先依照 date 欄位比較，若無日期則依會議名稱標題比較
        let sortedTitles = Object.keys(filteredMeetings).sort((a, b) => {
            const dateA = filteredMeetings[a].date || '';
            const dateB = filteredMeetings[b].date || '';

            if (dateA && dateB) {
                return dateA.localeCompare(dateB);
            }
            return a.localeCompare(b);
        });

        // 「由新到舊」(desc) 進行反轉
        if (sortOrder === 'desc') {
            sortedTitles.reverse();
        }

        renderMeetings(filteredMeetings, sortedTitles);
    }

    // ================= 5. 畫面渲染 =================
    function renderMeetings(meetings, sortedTitles) {
        const container = document.getElementById('meetings-container');
        container.innerHTML = '';

        if (sortedTitles.length === 0) {
            container.innerHTML = '<div class="no-data">🔍 查無符合關鍵字的會議紀錄</div>';
            return;
        }

        sortedTitles.forEach(title => {
            const meeting = meetings[title];
            const card = document.createElement('div');
            card.className = 'meeting-card';

            let pdfButtonHtml = '';
            if (meeting.pdfUrl) {
                pdfButtonHtml = `<a href="${meeting.pdfUrl}" target="_blank" class="pdf-btn">📄 查看完整紀錄 PDF</a>`;
            }

            let itemsHtml = '';
            if (meeting.items && meeting.items.length > 0) {
                itemsHtml = '<ul class="item-list">' + meeting.items.map(item => `
                    <li class="item-row">
                        <span class="item-tag">${escapeHtml(item.tag)}</span>
                        <span class="item-content">${escapeHtml(item.content)}</span>
                    </li>
                `).join('') + '</ul>';
            } else {
                itemsHtml = '<p style="color: #999; font-style: italic;">（無詳細決議摘要）</p>';
            }

            card.innerHTML = `
                <div class="meeting-header">
                    <div>
                        <h2 class="meeting-title">${escapeHtml(title)}</h2>
                        <div class="meeting-date">🗓️ 開會日期：${escapeHtml(meeting.date || '未提供')}</div>
                    </div>
                    <div>${pdfButtonHtml}</div>
                </div>
                ${itemsHtml}
            `;

            container.appendChild(card);
        });
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-container');
        errorDiv.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
